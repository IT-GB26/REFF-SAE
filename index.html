<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recepción - Ingreso de Clientes</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; gap: 20px; }
        .form-container { background: #ffffff; padding: 30px; border-radius: 20px; width: 100%; max-width: 600px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); }
        .sidebar-container { background: #ffffff; padding: 20px; border-radius: 20px; width: 340px; height: 620px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); display: flex; flex-direction: column; box-sizing: border-box; }
        .sidebar-title { font-size: 15px; font-weight: 800; color: #0f172a; text-transform: uppercase; margin-bottom: 12px; text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
        .sidebar-list { overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; }
        .sidebar-card { background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
        .sidebar-card-header { display: flex; justify-content: space-between; align-items: center; }
        .s-id { font-size: 18px; font-weight: 900; color: #0284c7; }
        .s-info-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .s-nombre { font-size: 14px; font-weight: 700; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
        .s-detalles { font-size: 11px; color: #64748b; }
        .proximo-turno-box { background: #f0fdf4; border: 1.5px solid #bbf7d0; border-radius: 12px; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .proximo-turno-label { font-size: 13px; font-weight: 700; color: #166534; text-transform: uppercase; }
        .proximo-turno-num { font-size: 22px; font-weight: 900; color: #15803d; }
        .logo-container { text-align: center; margin-bottom: 15px; }
        .logo-container img { max-height: 55px; object-fit: contain; }
        h2 { text-align: center; color: #0f172a; margin-top: 0; font-weight: 800; font-size: 20px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .full-width { grid-column: span 2; }
        label { font-weight: 700; color: #334155; display: block; margin-top: 6px; font-size: 11px; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 9px; margin-top: 3px; border: 1.5px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 13px; background: #f8fafc; }
        button[type="submit"] { background: #0284c7; color: white; padding: 12px; border: none; width: 100%; border-radius: 10px; font-size: 15px; cursor: pointer; font-weight: bold; margin-top: 15px; }
            .view-btn { background:#0284c7;color:white;border:0;padding:5px 10px;border-radius:6px;cursor:pointer;font-weight:700;font-size:11px; }
        #modalDetalles { position:fixed;inset:0;background:rgba(15,23,42,.7);z-index:9999;display:none;align-items:center;justify-content:center; }
        .modal-card { background:white;width:500px;max-width:90%;max-height:90vh;overflow:auto;border-radius:16px;padding:28px;box-shadow:0 10px 25px rgba(0,0,0,.3); }
        .modal-card h3 { color:#0284c7;margin-top:0;border-bottom:2px solid #e2e8f0;padding-bottom:10px; }
        .modal-close { background:#64748b;color:white;border:0;width:100%;padding:10px;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:18px; }
    </style>
</head>
<body>
<div id="modalDetalles"><div class="modal-card"><h3>Detalles del Turno</h3><div id="contenidoModal"></div><button class="modal-close" onclick="cerrarModal()">Cerrar</button></div></div>

<div class="form-container">
    <div class="logo-container"><img src="img/logo.png" alt="Logo Empresa"></div>
    <h2>Registro de Nuevo Cliente</h2>

    <div class="proximo-turno-box">
        <span class="proximo-turno-label">Siguiente Turno Estimado:</span>
        <span class="proximo-turno-num" id="lblSiguienteTurno">A1</span>
    </div>

    <form id="registroForm">
        <div class="form-grid">
            <div><label>Nombres:</label><input type="text" id="nombres" required autocomplete="off" autofocus></div>
            <div><label>Apellidos:</label><input type="text" id="apellidos" required autocomplete="off"></div>
            <div><label>Género:</label><select id="genero"><option value="Masculino">Masculino</option><option value="Femenino">Femenino</option></select></div>
            <div><label>Fecha de Nacimiento:</label><input type="date" id="fechaNacimiento"></div>
            <div><label>Nombre del Padre:</label><input type="text" id="padre"></div>
            <div><label>Nombre de la Madre:</label><input type="text" id="madre"></div>
            <div class="full-width"><label>Lugar de Nacimiento:</label><input type="text" id="lugarNacimiento"></div>
            <div class="full-width"><label>Comentarios:</label><textarea id="comentarios" rows="2"></textarea></div>
        </div>
        <button type="submit" id="btnSubmit">Guardar e Imprimir Turno</button>
    </form>
</div>

<div class="sidebar-container">
    <div class="sidebar-title">Historial de Ingresos Hoy</div>
    <div class="sidebar-list" id="sidebarLista">
        <div style="text-align: center; color: #94a3b8; margin-top: 50px; font-size: 13px;">No hay registros previos en esta sesión</div>
    </div>
</div>

<script>
const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbznHSwy_Rujdv5En5GZRqr4TrwS_i86jVmLjsr5fsk2y6CGFsHDal1l_Z37g5PI3-XU/exec";
const CACHE_DATOS = "colas_recepcion_datos_v2";
const CACHE_PENDIENTES = "colas_recepcion_pendientes_v2";
const CACHE_CONTADOR = "colas_recepcion_contador_v2";
let datosCache = leerJSON(CACHE_DATOS, []);
let pendientesEnvio = leerJSON(CACHE_PENDIENTES, []);
const CACHE_FECHA_CONTADOR = "colas_recepcion_fecha_contador_v2";
let contadorTurnoLocal = Number(localStorage.getItem(CACHE_CONTADOR) || 1);
let flushActivo = false;

function fechaLocalClave(v=new Date()) {
    const d = new Date(v);
    if (isNaN(d)) return '';
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function asegurarContadorDelDia() {
    const hoy = fechaLocalClave();
    const guardada = localStorage.getItem(CACHE_FECHA_CONTADOR);
    if (guardada !== hoy) {
        contadorTurnoLocal = 1;
        localStorage.setItem(CACHE_CONTADOR, '1');
        localStorage.setItem(CACHE_FECHA_CONTADOR, hoy);
    }
}


function fechaSolo(v){
    if(!v) return '';
    const s=String(v).trim();
    const m=s.match(/^(\d{4}-\d{2}-\d{2})/);
    if(m) return m[1];
    const d=new Date(s);
    if(!isNaN(d)) return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    return s;
}

function leerJSON(clave, defecto) { try { return JSON.parse(localStorage.getItem(clave)) ?? defecto; } catch(e) { return defecto; } }
function guardarJSON(clave, valor) { try { localStorage.setItem(clave, JSON.stringify(valor)); } catch(e) {} }
function hoyLocal(v) { const d=new Date(v); return !isNaN(d) && d.toLocaleDateString()===new Date().toLocaleDateString(); }
function recalcularContador() {
    asegurarContadorDelDia();
    let max=0;
    [...datosCache, ...pendientesEnvio.map(x=>x.registro)].forEach(r=>{
        if (r.FechaHora && hoyLocal(r.FechaHora)) {
            const m=String(r.ID||'').trim().match(/^A(\d+)$/i);
            if(m) max=Math.max(max,Number(m[1]));
        }
    });
    contadorTurnoLocal=max+1;
    localStorage.setItem(CACHE_CONTADOR,String(contadorTurnoLocal));
    localStorage.setItem(CACHE_FECHA_CONTADOR,fechaLocalClave());
    document.getElementById('lblSiguienteTurno').innerText='A'+contadorTurnoLocal;
}
function pintarHistorial() {
    const lista=document.getElementById('sidebarLista'); lista.innerHTML='';
    const hoy=[...datosCache.filter(r=>r.FechaHora&&hoyLocal(r.FechaHora)), ...pendientesEnvio.map(x=>x.registro)]
        .filter((r,i,a)=>a.findIndex(x=>String(x.UID||x.ClientRequestId||x.ID)===String(r.UID||r.ClientRequestId||r.ID))===i)
        .sort((a,b)=>new Date(b.FechaHora||0)-new Date(a.FechaHora||0));
    if(!hoy.length){ lista.innerHTML='<div style="text-align: center; color: #94a3b8; margin-top: 50px; font-size: 13px;">No hay registros previos en esta sesión</div>'; return; }
    hoy.forEach(agregarAHistorialLateral);
}
async function sincronizarSiguienteTurno() {
    try {
        const ctrl=new AbortController(); const tm=setTimeout(()=>ctrl.abort(),4500); let res;
        try { res=await fetch(URL_WEB_APP+'?accion=estado&t='+Date.now(),{cache:'no-store',signal:ctrl.signal}); }
        finally { clearTimeout(tm); }
        if(!res.ok) throw new Error();
        const servidor=await res.json();
        datosCache=Array.isArray(servidor)?servidor:(servidor.datos||[]); guardarJSON(CACHE_DATOS,datosCache);
        recalcularContador(); pintarHistorial();
    } catch(e) { recalcularContador(); }
}
function crearToken(){ return 'rx-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10); }
function programarEnvio(){ setTimeout(enviarPendientes,50); }
async function enviarPendientes(){
    if(flushActivo || !pendientesEnvio.length || !navigator.onLine) return;
    flushActivo=true;
    try {
        const item=pendientesEnvio[0];
        const res=await fetch(URL_WEB_APP,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(item.payload),cache:'no-store'});
        if(!res.ok) throw new Error('HTTP '+res.status);
        const resultado=await res.json();
        if(resultado.status!=='ok') throw new Error(resultado.message||'No guardado');
        const confirmado={...item.registro,UID:resultado.uid||'',ID:resultado.id||item.registro.ID,FechaHora:resultado.FechaHora||item.registro.FechaHora,Estado:'Pendiente',ClientRequestId:item.token};
        // Quitamos solo el registro provisional de ESTA petición, no otros A1/A2 históricos.
        datosCache=datosCache.filter(r=>String(r.ClientRequestId||'')!==String(item.token)); datosCache.push(confirmado); guardarJSON(CACHE_DATOS,datosCache);
        pendientesEnvio.shift(); guardarJSON(CACHE_PENDIENTES,pendientesEnvio); pintarHistorial();
        if(pendientesEnvio.length) setTimeout(enviarPendientes,100);
    } catch(e) { setTimeout(enviarPendientes,3000); }
    finally { flushActivo=false; }
}
window.addEventListener('online',()=>{enviarPendientes(); sincronizarSiguienteTurno();});
window.addEventListener('pageshow',()=>{pintarHistorial(); recalcularContador();});
window.onload=function(){ asegurarContadorDelDia(); pintarHistorial(); recalcularContador(); sincronizarSiguienteTurno(); programarEnvio(); setInterval(sincronizarSiguienteTurno,8000); };

document.getElementById('registroForm').addEventListener('submit',function(e){
    e.preventDefault(); const btn=document.getElementById('btnSubmit'); btn.disabled=true;
    const id='A'+contadorTurnoLocal; const ahora=new Date().toISOString(); const token=crearToken();
    const datos={accion:'nuevo_registro',clientRequestId:token,idSolicitado:id,nombres:document.getElementById('nombres').value.trim(),apellidos:document.getElementById('apellidos').value.trim(),genero:document.getElementById('genero').value,fechaNacimiento:document.getElementById('fechaNacimiento').value,padre:document.getElementById('padre').value.trim(),madre:document.getElementById('madre').value.trim(),lugarNacimiento:document.getElementById('lugarNacimiento').value.trim(),comentarios:document.getElementById('comentarios').value.trim()};
    const registro={UID:'',ID:id,FechaHora:ahora,Nombres:datos.nombres,Apellidos:datos.apellidos,Genero:datos.genero,FechaNacimiento:datos.fechaNacimiento,Padre:datos.padre,Madre:datos.madre,LugarNacimiento:datos.lugarNacimiento,Comentarios:datos.comentarios,Estado:'Pendiente',ClientRequestId:token};
    pendientesEnvio.push({token,creado:Date.now(),payload:datos,registro}); guardarJSON(CACHE_PENDIENTES,pendientesEnvio);
    contadorTurnoLocal++; localStorage.setItem(CACHE_CONTADOR,String(contadorTurnoLocal)); document.getElementById('registroForm').reset(); pintarHistorial(); document.getElementById('lblSiguienteTurno').innerText='A'+contadorTurnoLocal;
    btn.style.backgroundColor='#16a34a'; btn.innerText=`¡Guardado local: ${id}!`;
    setTimeout(()=>{btn.style.backgroundColor='#0284c7';btn.innerText='Guardar e Imprimir Turno';btn.disabled=false;document.getElementById('nombres').focus();},250);
    programarEnvio();
});
function agregarAHistorialLateral(cliente){
    const lista=document.getElementById('sidebarLista'); if(lista.innerHTML.includes('No hay registros')) lista.innerHTML='';
    const card=document.createElement('div'); card.className='sidebar-card'; card.innerHTML=`<div class="sidebar-card-header"><span class="s-id">${cliente.ID}</span><button class="view-btn" type="button">Ver</button></div><div class="s-info-row"><div class="s-nombre">${cliente.Nombres||cliente.nombres||''} ${cliente.Apellidos||cliente.apellidos||''}</div><span class="s-detalles">${fechaSolo(cliente.FechaNacimiento||'')}</span></div>`; card.querySelector('.view-btn').onclick=()=>verDetallesRecepcion(cliente); lista.appendChild(card);
}
function verDetallesRecepcion(c){
 const html=`<p><b>Turno:</b> ${c.ID||''}</p><p><b>Fecha/Hora:</b> ${c.FechaHora?new Date(c.FechaHora).toLocaleString():''}</p><p><b>Nombres:</b> ${c.Nombres||c.nombres||''}</p><p><b>Apellidos:</b> ${c.Apellidos||c.apellidos||''}</p><p><b>Género:</b> ${c.Genero||c.genero||''}</p><p><b>Fecha de nacimiento:</b> ${fechaSolo(c.FechaNacimiento||c.fechaNacimiento||'')}</p><p><b>Padre:</b> ${c.Padre||c.padre||'N/D'}</p><p><b>Madre:</b> ${c.Madre||c.madre||'N/D'}</p><p><b>Lugar de nacimiento:</b> ${c.LugarNacimiento||c.lugarNacimiento||''}</p><p><b>Comentarios:</b> ${c.Comentarios||c.comentarios||'Ninguno'}</p><p><b>Estado:</b> ${c.Estado||'Pendiente'}</p>`;
 document.getElementById('contenidoModal').innerHTML=html; document.getElementById('modalDetalles').style.display='flex';
}
function cerrarModal(){document.getElementById('modalDetalles').style.display='none';}
</script>
</body>
</html>
