<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Jefatura - Supervisor de Sectores</title>
    <style>
        :root { --primary: #0f172a; --accent: #0284c7; --success: #16a34a; --warning: #ca8a04; --bg: #f8fafc; --card-bg: #ffffff; --text: #334155; --border: #e2e8f0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; padding: 30px; color: var(--text); }
        .container { max-width: 1400px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 20px 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); margin-bottom: 25px; border: 1px solid var(--border); }
        .sector-selector-group { display: flex; gap: 10px; }
        .sector-btn { background: #e2e8f0; color: var(--primary); border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .sector-btn.active { background: var(--accent); color: white; }
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .kpi-card { background: var(--card-bg); padding: 20px 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid var(--border); }
        .kpi-title { font-size: 13px; font-weight: 700; text-transform: uppercase; color: #64748b; }
        .kpi-value { font-size: 32px; font-weight: 900; color: var(--primary); margin-top: 8px; }
        .toolbar { background: var(--card-bg); padding: 20px 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid var(--border); margin-bottom: 25px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between; }
        input, select { padding: 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; background: #f8fafc; }
        .btn-action { background: var(--accent); color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-export { background: var(--success); color: white; }
        .card-table { background: var(--card-bg); border-radius: 16px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid var(--border); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { background-color: #f8fafc; color: #475569; font-weight: 700; text-transform: uppercase; font-size: 12px; }
        .badge { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; display: inline-block; }
        .badge-pendiente { background: #fef9c3; color: #a16207; }
        .badge-llamado { background: #e0f2fe; color: #0369a1; }
        .badge-resuelto { background: #dcfce7; color: #166534; }
        .tabs-jefatura { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-jefatura { background: #e2e8f0; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; color: #334155; }
        .tab-jefatura.active { background: #0f172a; color: white; }
        .btn-ver { background:#0284c7; color:white; border:none; padding:7px 12px; border-radius:6px; cursor:pointer; font-weight:700; }
        #modalDetalles { position:fixed; inset:0; background:rgba(15,23,42,.72); z-index:9999; display:none; align-items:center; justify-content:center; }
        .modal-card { background:white; width:520px; max-width:92%; max-height:90vh; overflow:auto; border-radius:16px; padding:28px; box-shadow:0 15px 40px rgba(0,0,0,.25); }
        .modal-card h3 { margin-top:0; color:#0284c7; border-bottom:2px solid #e2e8f0; padding-bottom:10px; }
        .modal-card p { margin:8px 0; }
        .modal-close { width:100%; margin-top:18px; padding:10px; border:0; border-radius:8px; background:#64748b; color:white; font-weight:700; cursor:pointer; }
    </style>
</head>
<body>
<div id="modalDetalles">
  <div class="modal-card">
    <h3>Detalles del Turno</h3>
    <div id="contenidoModal"></div>
    <button class="modal-close" onclick="cerrarModal()">Cerrar</button>
  </div>
</div>

<div class="container">
    <div class="header">
        <div>
            <h2>Panel de Jefatura y Supervisión</h2>
            <span style="font-size: 13px; color: #64748b;" id="lblSectorSub">Sector Activo: El Congo</span>
        </div>
        <div class="sector-selector-group">
            <button class="sector-btn active" id="btnSectorCongo" onclick="cambiarSector('congo')">El Congo</button>
            <button class="sector-btn" id="btnSectorCoatepeque" onclick="cambiarSector('coatepeque')">Coatepeque</button>
        </div>
    </div>

    <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-title">Atendidos (Periodo)</div><div class="kpi-value" id="kpiAtendidos">0</div></div>
        <div class="kpi-card"><div class="kpi-title">Pendientes (Periodo)</div><div class="kpi-value" id="kpiPendientes" style="color: var(--warning);">0</div></div>
        <div class="kpi-card"><div class="kpi-title">Llamados (Periodo)</div><div class="kpi-value" id="kpiLlamados" style="color: var(--accent);">0</div></div>
    </div>

    <div class="toolbar">
        <div>
            <select id="selectPeriodoExport">
                <option value="mes">Mes Actual</option><option value="todo">Histórico Completo</option>
            </select>
            <button class="btn-action btn-export" onclick="exportarExcel()">📊 Descargar Excel</button>
        </div>
        <div>
            <select id="selectVentanillaDestino"><option value="1">Ventanilla 1</option><option value="3" selected>Ventanilla 3</option></select>
            <input type="text" id="inputMensajeJefatura" placeholder="Enviar aviso a agente...">
            <button class="btn-action" onclick="enviarMensaje()">Enviar Aviso</button>
        </div>
    </div>

    <div class="card-table">
        <div class="tabs-jefatura">
            <button class="tab-jefatura active" id="tabHoy" onclick="cambiarFiltroFecha('hoy')">Hoy</button>
            <button class="tab-jefatura" id="tabAyer" onclick="cambiarFiltroFecha('ayer')">Ayer</button>
            <button class="tab-jefatura" id="tabAntier" onclick="cambiarFiltroFecha('antier')">Antier</button>
            <input type="date" id="fechaEspecifica" onchange="cambiarFiltroFecha('fecha')" title="Seleccionar fecha">
        </div>
        <table>
            <thead>
                <tr><th>Turno ID</th><th>Fecha y Hora</th><th>Cliente</th><th>Estado</th><th>Responsable</th><th>Datos</th></tr>
            </thead>
            <tbody id="tablaSupervisor"><tr><td colspan="6" style="text-align: center;">Cargando datos...</td></tr></tbody>
        </table>
    </div>
</div>

<script>
// URLs independientes para cada sector/base de datos
const URL_CONGO = "https://script.google.com/macros/s/AKfycbznHSwy_Rujdv5En5GZRqr4TrwS_i86jVmLjsr5fsk2y6CGFsHDal1l_Z37g5PI3-XU/exec";
const URL_COATEPEQUE = "https://script.google.com/macros/s/REEMPLAZA_CON_URL_COATEPEQUE_AQUI/exec"; // Reemplace aquí con la URL de su otra API de Coatepeque

let sectorActual = localStorage.getItem('jefatura_sector_actual') || 'congo';
const CACHE_KEY_CONGO = 'colas_supervisor_datos_congo_v2';
const CACHE_KEY_COATEPEQUE = 'colas_supervisor_datos_coatepeque_v2';

let datosGlobalesSector = []; 
let filtroFechaActual = 'hoy'; 
let peticion = false;

function obtenerUrlActiva() {
    return sectorActual === 'coatepeque' ? URL_COATEPEQUE : URL_CONGO;
}

function obtenerCacheKeyActiva() {
    return sectorActual === 'coatepeque' ? CACHE_KEY_COATEPEQUE : CACHE_KEY_CONGO;
}

function leerCache(){
    try {
        datosGlobalesSector = JSON.parse(localStorage.getItem(obtenerCacheKeyActiva()) || '[]');
        if(!Array.isArray(datosGlobalesSector)) datosGlobalesSector = [];
    } catch(e) { datosGlobalesSector = []; }
}

function cambiarSector(sector) {
    sectorActual = sector;
    localStorage.setItem('jefatura_sector_actual', sector);
    document.getElementById('btnSectorCongo').className = 'sector-btn' + (sector === 'congo' ? ' active' : '');
    document.getElementById('btnSectorCoatepeque').className = 'sector-btn' + (sector === 'coatepeque' ? ' active' : '');
    document.getElementById('lblSectorSub').innerText = 'Sector Activo: ' + (sector === 'coatepeque' ? 'Coatepeque' : 'El Congo');
    leerCache();
    renderSupervisor();
    cargarSupervisor();
}

function cambiarFiltroFecha(tipo){
    filtroFechaActual = tipo;
    document.getElementById('tabHoy').className = 'tab-jefatura' + (tipo === 'hoy' ? ' active' : '');
    document.getElementById('tabAyer').className = 'tab-jefatura' + (tipo === 'ayer' ? ' active' : '');
    document.getElementById('tabAntier').className = 'tab-jefatura' + (tipo === 'antier' ? ' active' : '');
    renderSupervisor();
}

function renderSupervisor(){
    const hoy = new Date(); hoy.setHours(0,0,0,0);
    const ayer = new Date(hoy); ayer.setDate(hoy.getDate()-1);
    const antier = new Date(hoy); antier.setDate(hoy.getDate()-2);

    const mismoDia=(valor, objetivo)=>{
        if(!valor) return false;
        const d=new Date(valor);
        return !isNaN(d) && d.getFullYear()===objetivo.getFullYear() &&
               d.getMonth()===objetivo.getMonth() && d.getDate()===objetivo.getDate();
    };

    const datosHoyKpi = datosGlobalesSector.filter(row => mismoDia(row.FechaHora,hoy));
    document.getElementById('kpiAtendidos').innerText = datosHoyKpi.filter(d => d.Estado === 'Resuelto').length;
    document.getElementById('kpiPendientes').innerText = datosHoyKpi.filter(d => d.Estado === 'Pendiente').length;
    document.getElementById('kpiLlamados').innerText = datosHoyKpi.filter(d => d.Estado === 'Llamado').length;

    let datosTabla=[];
    if(filtroFechaActual==='hoy') datosTabla=datosHoyKpi;
    else if(filtroFechaActual==='ayer') datosTabla=datosGlobalesSector.filter(r=>mismoDia(r.FechaHora,ayer));
    else if(filtroFechaActual==='antier') datosTabla=datosGlobalesSector.filter(r=>mismoDia(r.FechaHora,antier));
    else if(filtroFechaActual==='fecha'){
        const valor=document.getElementById('fechaEspecifica').value;
        if(valor){
            const p=valor.split('-').map(Number);
            const elegida=new Date(p[0],p[1]-1,p[2]);
            datosTabla=datosGlobalesSector.filter(r=>mismoDia(r.FechaHora,elegida));
        }
    }

    const tbody=document.getElementById('tablaSupervisor');
    tbody.innerHTML='';
    if(!datosTabla.length){
        tbody.innerHTML='<tr><td colspan="6" style="text-align:center;color:#64748b;">No hay registros para la fecha seleccionada.</td></tr>';
        return;
    }
    [...datosTabla].sort((a,b)=>new Date(b.FechaHora||0)-new Date(a.FechaHora||0)).forEach(row=>{
        const tr=document.createElement('tr');
        const badge=row.Estado==='Llamado'?'badge-llamado':(row.Estado==='Resuelto'?'badge-resuelto':'badge-pendiente');
        const fechaFormat=row.FechaHora?new Date(row.FechaHora).toLocaleString():'';
        tr.innerHTML=`<td><b>${row.ID}</b></td><td>${fechaFormat}</td><td>${row.Nombres} ${row.Apellidos}</td><td><span class="badge ${badge}">${row.Estado}</span></td><td>${row.AtendidoPor || (row.Estado === 'Llamado' ? 'Ventanilla ' + row.Ventanilla : 'Pendiente')}</td><td><button class="btn-ver" onclick="verDetalles('${row.UID}')">👁️ Ver</button></td>`;
        tbody.appendChild(tr);
    });
}

async function cargarSupervisor(){
    if(peticion || !navigator.onLine) return;
    peticion = true;
    try {
        let urlActiva = obtenerUrlActiva();
        if(urlActiva.includes('REEMPLAZA_')) {
            datosGlobalesSector = [];
            renderSupervisor();
            peticion = false;
            return;
        }
        let res = await fetch(urlActiva + '?accion=estado&t=' + Date.now(), {cache: 'no-store'});
        if(!res.ok) throw new Error();
        let j = await res.json();
        datosGlobalesSector = Array.isArray(j) ? j : (j.datos || []);
        localStorage.setItem(obtenerCacheKeyActiva(), JSON.stringify(datosGlobalesSector));
        renderSupervisor();
    } catch(e) {} finally { peticion = false; }
}

async function enviarMensaje(){
    let mensaje = document.getElementById('inputMensajeJefatura').value.trim();
    if(!mensaje) return;
    try {
        const r=await fetch(obtenerUrlActiva(), {
            method: 'POST',
            headers: {'Content-Type': 'text/plain;charset=utf-8'},
            body: JSON.stringify({accion: 'enviar_mensaje', ventanilla: document.getElementById('selectVentanillaDestino').value, mensaje, clientRequestId: 'msg-' + Date.now()}),
            cache:'no-store'
        });
        const j=await r.json();
        if(!r.ok || !j || j.status!=='ok') throw new Error((j&&j.message)||'No confirmado');
        avisoSupervisor('Aviso enviado y guardado para la ventanilla.',true);
        document.getElementById('inputMensajeJefatura').value = '';
    } catch(e) { avisoSupervisor('No se pudo enviar el aviso.',false); }
}

// Inicialización según el sector guardado
cambiarSector(sectorActual);
setInterval(cargarSupervisor, 4000);
window.addEventListener('online', cargarSupervisor);
document.addEventListener('visibilitychange', () => {
    if(!document.hidden){ leerCache(); renderSupervisor(); cargarSupervisor(); }
});

function exportarExcel(){
    let tablaHTML = '<table><tr><th>ID</th><th>Fecha</th><th>Nombre</th><th>Estado</th></tr>';
    datosGlobalesSector.forEach(r => {
        tablaHTML += `<tr><td>${r.ID}</td><td>${r.FechaHora}</td><td>${r.Nombres} ${r.Apellidos}</td><td>${r.Estado}</td></tr>`;
    });
    tablaHTML += '</table>';
    let blob = new Blob(['\ufeff' + tablaHTML], {type: 'application/vnd.ms-excel'});
    let link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `Reporte_Turnos_${sectorActual}.xls`;
    link.click();
}

function verDetalles(uid){
    const row=datosGlobalesSector.find(x=>String(x.UID||'')===String(uid));
    if(!row) return;
    const fechaNac=row.FechaNacimiento ? String(row.FechaNacimiento).split('T')[0] : '';
    document.getElementById('contenidoModal').innerHTML=`
      <p><b>ID de Turno:</b> ${row.ID||''}</p>
      <p><b>Fecha y Hora:</b> ${row.FechaHora ? new Date(row.FechaHora).toLocaleString() : ''}</p>
      <p><b>Nombres:</b> ${row.Nombres||''}</p>
      <p><b>Apellidos:</b> ${row.Apellidos||''}</p>
      <p><b>Género:</b> ${row.Genero||''}</p>
      <p><b>Fecha de Nacimiento:</b> ${fechaNac}</p>
      <p><b>Padre:</b> ${row.Padre||'N/D'}</p>
      <p><b>Madre:</b> ${row.Madre||'N/D'}</p>
      <p><b>Lugar de Nacimiento:</b> ${row.LugarNacimiento||''}</p>
      <p><b>Comentarios:</b> ${row.Comentarios||'Ninguno'}</p>
      <p><b>Estado:</b> ${row.Estado||''}</p>
      <p><b>Ventanilla:</b> ${row.Ventanilla||'N/D'}</p>
      <p><b>Atendido por:</b> ${row.AtendidoPor||'N/D'}</p>`;
    document.getElementById('modalDetalles').style.display='flex';
}
function cerrarModal(){ document.getElementById('modalDetalles').style.display='none'; }

function avisoSupervisor(texto,ok=true){let d=document.getElementById('toastSupervisor');if(!d){d=document.createElement('div');d.id='toastSupervisor';d.style.cssText='position:fixed;right:25px;bottom:25px;z-index:10000;padding:15px 20px;border-radius:10px;color:white;font-weight:700;box-shadow:0 8px 25px rgba(0,0,0,.25)';document.body.appendChild(d);}d.style.background=ok?'#16a34a':'#dc2626';d.textContent=texto;d.style.display='block';clearTimeout(d._t);d._t=setTimeout(()=>d.style.display='none',3500);}
</script>
</body>
</html>
