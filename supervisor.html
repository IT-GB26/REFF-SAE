<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Jefatura - Supervisor de Sectores</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0f172a; --accent: #0284c7; --success: #16a34a; --warning: #ca8a04; --bg: #f8fafc; --card-bg: #ffffff; --text: #334155; --border: #e2e8f0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; padding: 30px; color: var(--text); }
        .container { max-width: 1400px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 20px 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); margin-bottom: 25px; border: 1px solid var(--border); }
        .sector-btn { background: #e2e8f0; color: var(--primary); border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-right: 5px; }
        .sector-btn.active { background: var(--accent); color: white; }
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .kpi-card { background: var(--card-bg); padding: 20px 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid var(--border); }
        .kpi-title { font-size: 13px; font-weight: 700; text-transform: uppercase; color: #64748b; }
        .kpi-value { font-size: 32px; font-weight: 900; color: var(--primary); margin-top: 8px; }
        .toolbar { background: var(--card-bg); padding: 20px 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid var(--border); margin-bottom: 25px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between; }
        input { padding: 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; background: #f8fafc; }
        .btn-action { background: var(--accent); color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-export { background: var(--success); color: white; }
        .card-table { background: var(--card-bg); border-radius: 16px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid var(--border); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { background-color: #f8fafc; color: #475569; font-weight: 700; text-transform: uppercase; font-size: 12px; }
        .badge { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; display: inline-block; }
        .badge-pendiente { background: #fef9c3; color: #a16207; }
        .badge-llamado { background: #e0f2fe; color: #0369a1; }
        .badge-resuelto { background: #dcfce7; color: #166534; }
        button.view-btn { background: #0284c7; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 12px; }

        /* Estilos para la Modal de Detalles */
        #modalDetalles { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.7); z-index: 10000; justify-content: center; align-items: center; }
        .modal-card { background: white; padding: 30px; border-radius: 12px; width: 450px; max-width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.2); position: relative; }
        .modal-card h3 { margin-top: 0; color: #0284c7; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .modal-body { font-size: 14px; color: #334155; display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; max-height: 60vh; overflow-y: auto; }
        .modal-body div span { font-weight: bold; color: #0f172a; }
        .modal-close-btn { background: #64748b; color: white; border: none; width: 100%; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<!-- MODAL DE DETALLES -->
<div id="modalDetalles">
    <div class="modal-card">
        <h3>Detalles del Turno</h3>
        <div class="modal-body" id="contenidoModalDetalles"></div>
        <button class="modal-close-btn" onclick="cerrarModalDetalles()">Cerrar</button>
    </div>
</div>

<div class="container">
    <div class="header">
        <div>
            <h2>Panel de Jefatura y Supervisión</h2>
            <span style="font-size: 13px; color: #64748b;">Monitoreo en tiempo real por sector</span>
        </div>
        <div>
            <button class="sector-btn active" id="btnSectorCongo" onclick="cambiarSectorSupervisor('El Congo')">El Congo</button>
            <button class="sector-btn" id="btnSectorCoatepeque" onclick="cambiarSectorSupervisor('Coatepeque')">Coatepeque</button>
        </div>
    </div>

    <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-title">Atendidos Hoy</div><div class="kpi-value" id="kpiAtendidos">0</div></div>
        <div class="kpi-card"><div class="kpi-title">Pendientes Hoy</div><div class="kpi-value" id="kpiPendientes" style="color: var(--warning);">0</div></div>
        <div class="kpi-card"><div class="kpi-title">Llamados Hoy</div><div class="kpi-value" id="kpiLlamados" style="color: var(--accent);">0</div></div>
    </div>

    <div class="toolbar">
        <div>
            <button class="btn-action btn-export" onclick="exportarExcel()">📊 Descargar Excel</button>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <input type="text" id="inputMensajeJefatura" placeholder="Escribir aviso general..." style="width: 300px;">
            <button class="btn-action" onclick="enviarAvisoJefatura()">📢 Enviar Aviso</button>
        </div>
    </div>

    <div class="card-table">
        <table>
            <thead>
                <tr>
                    <th>Turno ID</th>
                    <th>Hora</th>
                    <th>Cliente</th>
                    <th>Estado</th>
                    <th>Responsable</th>
                    <th style="text-align: center;">Acción</th>
                </tr>
            </thead>
            <tbody id="tablaSupervisor"><tr><td colspan="6" style="text-align: center;">Cargando datos...</td></tr></tbody>
        </table>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://kuvdvvhcixkczqfrzqvj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1dmR2dmhjaXhrY3pxZnJ6cXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2ODIyMTAsImV4cCI6MjEwNTI1ODIxMH0.2UgHDjz1RMbFLyxSuETRPQxOa1IWou9etk35_nE6r1k';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let sectorSeleccionado = "El Congo";
let datosGlobalesSector = [];

function cambiarSectorSupervisor(sector) {
    sectorSeleccionado = sector;
    document.getElementById('btnSectorCongo').className = sector === 'El Congo' ? 'sector-btn active' : 'sector-btn';
    document.getElementById('btnSectorCoatepeque').className = sector === 'Coatepeque' ? 'sector-btn active' : 'sector-btn';
    cargarSupervisor();
}

async function cargarSupervisor() {
    let { data, error } = await supabaseClient
        .from('turnos')
        .select('*')
        .eq('sector', sectorSeleccionado)
        .order('fecha_hora', { ascending: false });

    if (error || !data) return;

    datosGlobalesSector = data;
    let hoyStr = new Date().toDateString();
    let datosHoy = datosGlobalesSector.filter(row => row.fecha_hora && new Date(row.fecha_hora).toDateString() === hoyStr);
    
    document.getElementById('kpiAtendidos').innerText = datosHoy.filter(d => d.estado === "Resuelto").length;
    document.getElementById('kpiPendientes').innerText = datosHoy.filter(d => d.estado === "Pendiente").length;
    document.getElementById('kpiLlamados').innerText = datosHoy.filter(d => d.estado === "Llamado").length;

    let tbody = document.getElementById('tablaSupervisor');
    tbody.innerHTML = "";
    if (datosHoy.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#64748b;">No hay registros hoy en ${sectorSeleccionado}.</td></tr>`;
        return;
    }

    datosHoy.forEach(row => {
        let tr = document.createElement('tr');
        let badgeClass = row.estado === 'Llamado' ? 'badge-llamado' : (row.estado === 'Resuelto' ? 'badge-resuelto' : 'badge-pendiente');
        let turnoId = row.id;

        tr.innerHTML = `
            <td><b>${turnoId}</b></td>
            <td>${new Date(row.fecha_hora).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</td>
            <td>${row.nombres || ''} ${row.apellidos || ''}</td>
            <td><span class="badge ${badgeClass}">${row.estado}</span></td>
            <td>${row.atendido_por || (row.estado === 'Llamado' ? 'Ventanilla ' + row.ventanilla : 'Pendiente')}</td>
            <td style="text-align: center;"><button class="view-btn" onclick="verDetalles('${turnoId}')">👁️ Ver</button></td>
        `;
        tbody.appendChild(tr);
    });
}

function verDetalles(id) {
    let turno = datosGlobalesSector.find(r => String(r.id) === String(id));
    if (!turno) return;

    let padreVal = turno.padre ? `Padre: ${turno.padre}` : '';
    let madreVal = turno.madre ? `Madre: ${turno.madre}` : '';
    let nombrePadresVal = [padreVal, madreVal].filter(Boolean).join(' | ') || turno.nombre_padres || turno.padres || turno.nombres_padres || 'No registrado';
    let fechaNacimientoVal = turno.fecha_nacimiento || turno.fechaNacimiento || turno.nacimiento || 'No registrado';

    let contenido = `
        <div><span>ID de Turno:</span> ${turno.id || 'N/D'}</div>
        <div><span>Fecha y Hora:</span> ${turno.fecha_hora ? new Date(turno.fecha_hora).toLocaleString() : 'N/D'}</div>
        <div><span>Nombres:</span> ${turno.nombres || 'N/D'}</div>
        <div><span>Apellidos:</span> ${turno.apellidos || 'N/D'}</div>
        <div><span>Género:</span> ${turno.genero || 'N/D'}</div>
        <div><span>Fecha de Nacimiento:</span> ${fechaNacimientoVal}</div>
        <div><span>Nombre de los Padres:</span> ${nombrePadresVal}</div>
        <div><span>Sector:</span> ${turno.sector || 'N/D'}</div>
        <div><span>Estado:</span> ${turno.estado || 'N/D'}</div>
        <div><span>Ventanilla:</span> ${turno.ventanilla || 'N/D'}</div>
        <div><span>Atendido por:</span> ${turno.atendido_por || 'N/D'}</div>
        <div><span>Comentarios:</span> ${turno.comentarios || 'Ninguno'}</div>
    `;

    document.getElementById('contenidoModalDetalles').innerHTML = contenido;
    document.getElementById('modalDetalles').style.display = 'flex';
}

function cerrarModalDetalles() {
    document.getElementById('modalDetalles').style.display = 'none';
}

async function enviarAvisoJefatura() {
    let mensaje = document.getElementById('inputMensajeJefatura').value.trim();
    if (!mensaje) {
        alert("Por favor escriba un mensaje de aviso.");
        return;
    }

    let { error } = await supabaseClient.from('avisos').insert([{
        sector: sectorSeleccionado,
        ventanilla: "todas",
        mensaje: mensaje,
        timestamp: Date.now()
    }]);

    if (!error) {
        document.getElementById('inputMensajeJefatura').value = "";
    } else {
        alert("Error al enviar el aviso: " + error.message);
    }
}

function suscripcionTiempoRealSupervisor() {
    supabaseClient
        .channel('cambios-supervisor-general')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'turnos' }, payload => {
            cargarSupervisor();
        })
        .subscribe();
}

window.onload = function() {
    cargarSupervisor();
    suscripcionTiempoRealSupervisor();
};

function exportarExcel() {
    let tablaHTML = `<table><tr><th colspan="5">Reporte Sector: ${sectorSeleccionado}</th></tr><tr><th>ID</th><th>Fecha</th><th>Nombre</th><th>Estado</th><th>Atendido Por</th></tr>`;
    datosGlobalesSector.forEach(r => {
        tablaHTML += `<tr><td>${r.id}</td><td>${r.fecha_hora}</td><td>${r.nombres} ${r.apellidos}</td><td>${r.estado}</td><td>${r.atendido_por || ''}</td></tr>`;
    });
    tablaHTML += "</table>";
    let blob = new Blob(['\ufeff' + tablaHTML], { type: 'application/vnd.ms-excel' });
    let link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `Reporte_Turnos_${sectorSeleccionado}.xls`;
    link.click();
}
</script>
</body>
</html>
