<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pantalla Principal - Sala de Espera</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: #f8f9fa; color: #333; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        #audioOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.95); z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; padding: 20px; }
        #audioOverlay button { background: #0284c7; color: white; border: none; padding: 16px 40px; font-size: 20px; font-weight: bold; border-radius: 12px; cursor: pointer; }
        header { background: #ffffff; height: 10vh; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; border-bottom: 1px solid #e2e8f0; }
        header h1 { margin: 0; font-size: 24px; color: #1e293b; font-weight: 700; }
        #reloj { font-size: 22px; font-weight: 600; color: #64748b; }
        .main-layout { display: flex; height: 72vh; width: 100vw; }
        .ads-side { width: 25%; background: #ffffff; display: flex; justify-content: center; align-items: center; padding: 15px; border: 1px solid #e2e8f0; }
        .ads-side video { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
        .center-stage { width: 50%; background: #f8f9fa; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .ticket-box { background: #ffffff; border: 2px solid #cbd5e1; border-radius: 24px; padding: 20px; width: 95%; height: 92%; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 15px 35px rgba(0,0,0,0.08); }
        .label-turno { font-size: 22px; color: #64748b; text-transform: uppercase; font-weight: 700; }
        .numero-cliente { font-size: 180px; font-weight: 900; color: #0f172a; line-height: 1; margin: 10px 0; transition: transform 0.3s; }
        .animar-llamado { transform: scale(1.1); color: #0284c7; }
        .ventanilla-asignada { font-size: 42px; color: #0284c7; font-weight: 800; margin-top: 15px; background: #e0f2fe; padding: 10px 30px; border-radius: 14px; }
        .footer-espera { height: 18vh; background: #ffffff; border-top: 1px solid #e2e8f0; display: flex; align-items: center; padding: 0 30px; gap: 20px; }
        .espera-titulo { font-size: 16px; font-weight: 700; color: #64748b; text-transform: uppercase; min-width: 150px; }
        .espera-lista { display: flex; gap: 15px; overflow-x: auto; width: 100%; }
        .turno-card { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px 20px; text-align: center; min-width: 130px; }
        .turno-card .t-id { font-size: 24px; font-weight: 800; color: #1e293b; }
    </style>
</head>
<body>

<div id="audioOverlay">
    <h2>Sistema de Turnos Activo</h2>
    <p>Haga clic en el botón para iniciar la reproducción fluida de la sala.</p>
    <button onclick="iniciarSistemaPantalla()">Iniciar Pantalla</button>
</div>

<header>
    <h1>SALA DE ESPERA</h1>
    <div id="reloj">00:00:00</div>
</header>

<div class="main-layout">
    <div class="ads-side"><video id="videoPlaylist" autoplay muted playsinline></video></div>
    <div class="center-stage">
        <div class="ticket-box">
            <div class="label-turno">Turno Actual</div>
            <div class="numero-cliente" id="lblNumero">---</div>
            <div><span class="ventanilla-asignada" id="lblVentanilla">VENTANILLA --</span></div>
        </div>
    </div>
    <div class="ads-side"><div style="color:#64748b; font-weight:bold;">Publicidad / Anuncios</div></div>
</div>

<div class="footer-espera">
    <div class="espera-titulo">Próximos Turnos</div>
    <div class="espera-lista" id="contenedorProximos"><div class="turno-card"><div class="t-id">--</div></div></div>
</div>

<script>
const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbzvDBG4WC_M_TmYxCmIKblX24VxNb1Fx_7D7nJJP1DyEyVJDxkuh312FVtPeAUSNAQ2/exec";
let ultimoTimestampProcesado = Date.now();
let colaTurnosVoz = [];
let reproduciendoVozActiva = false;
const listaVideos = ["videos/anuncio1.mp4", "videos/anuncio4.mp4"];
let indiceVideoActual = 0;

function iniciarSistemaPantalla() {
    document.getElementById('audioOverlay').style.display = 'none';
    ultimoTimestampProcesado = Date.now();
    iniciarReproductorVideos();
    setInterval(sincronizarPantalla, 2500); // Sincronización rápida y constante cada 2.5s
}

function iniciarReproductorVideos() {
    let elementoVideo = document.getElementById('videoPlaylist');
    if (!elementoVideo) return;
    elementoVideo.volume = 0.15;
    elementoVideo.src = listaVideos[indiceVideoActual];
    elementoVideo.play().catch(() => {});
    elementoVideo.onended = () => {
        indiceVideoActual = (indiceVideoActual + 1) % listaVideos.length;
        iniciarReproductorVideos();
    };
}

setInterval(() => { document.getElementById('reloj').innerText = new Date().toLocaleTimeString(); }, 1000);

function convertirNumeroALetras(numStr) {
    let match = numStr.match(/\d+/);
    if (!match) return numStr;
    let num = parseInt(match[0], 10);
    const unidades = ["", "uno", "dos", "tres", "cuatro", "cinco", "seis", "siete", "ocho", "nueve"];
    const especiales = ["diez", "once", "doce", "trece", "catorce", "quince", "dieciséis", "diecisiete", "dieciocho", "diecinueve"];
    const decenas = ["", "", "veinte", "treinta", "cuarenta", "cincuenta", "sesenta", "setenta", "ochenta", "noventa"];
    if (num < 10) return unidades[num];
    if (num >= 10 && num < 20) return especiales[num - 10];
    if (num >= 20 && num < 30) return num === 20 ? "veinte" : "veinti" + unidades[num - 20];
    if (num >= 30 && num < 100) {
        let d = Math.floor(num / 10);
        let u = num % 10;
        return decenas[d] + (u > 0 ? " y " + unidades[u] : "");
    }
    return num.toString();
}

function procesarColaVoz() {
    if (reproduciendoVozActiva || colaTurnosVoz.length === 0) return;
    reproduciendoVozActiva = true;
    let item = colaTurnosVoz.shift();
    let elementoVideo = document.getElementById('videoPlaylist');
    if (elementoVideo) elementoVideo.volume = 0.0;

    let letra = item.id.replace(/[0-9]/g, '');
    let numLimpio = convertirNumeroALetras(item.id);
    let texto = `Número de cliente ${letra} ${numLimpio}, pasar a ventanilla ${item.ventanilla}.`;
    
    let utterance = new SpeechSynthesisUtterance(texto);
    utterance.lang = 'es-ES';
    utterance.rate = 0.85;
    utterance.volume = 1.0;

    utterance.onend = () => {
        setTimeout(() => {
            if (elementoVideo) elementoVideo.volume = 0.15;
            reproduciendoVozActiva = false;
            procesarColaVoz();
        }, 1500);
    };
    window.speechSynthesis.speak(utterance);
}

function activarAnimacionTurno() {
    let elemento = document.getElementById('lblNumero');
    elemento.classList.add('animar-llamado');
    setTimeout(() => { elemento.classList.remove('animar-llamado'); }, 2500);
}

async function sincronizarPantalla() {
    try {
        let res = await fetch(URL_WEB_APP + "?t=" + new Date().getTime());
        let datos = await res.json();
        
        let pendientes = datos.filter(row => String(row.Estado).trim().toLowerCase() === "pendiente");
        let contenedorProximos = document.getElementById('contenedorProximos');
        contenedorProximos.innerHTML = "";

        if (pendientes.length === 0) {
            contenedorProximos.innerHTML = `<div class="turno-card"><div class="t-id">--</div></div>`;
        } else {
            pendientes.slice(0, 8).forEach(p => {
                let card = document.createElement('div');
                card.className = 'turno-card';
                card.innerHTML = `<div class="t-id">${p.ID}</div>`;
                contenedorProximos.appendChild(card);
            });
        }

        let llamados = datos.filter(row => String(row.Estado).trim().toLowerCase() === "llamado");
        if (llamados.length > 0) {
            llamados.sort((a, b) => b.UltimoLlamado - a.UltimoLlamado);
            let actual = llamados[0];

            if (actual.UltimoLlamado > ultimoTimestampProcesado) {
                ultimoTimestampProcesado = actual.UltimoLlamado;
                document.getElementById('lblNumero').innerText = actual.ID;
                document.getElementById('lblVentanilla').innerText = "VENTANILLA " + (actual.Ventanilla || "3");

                activarAnimacionTurno();
                colaTurnosVoz.push({ id: actual.ID, ventanilla: actual.Ventanilla || "3" });
                procesarColaVoz();
            }
        }
    } catch (e) {}
}
</script>
</body>
</html>
