<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Oficinas - Control de Turnos</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
        .header img { max-height: 55px; }
        .ventanilla-box { background: #e0f2fe; color: #0369a1; padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 16px; }
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.9); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .login-card { background: white; padding: 40px; border-radius: 16px; width: 380px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .login-card input, .login-card select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; box-sizing: border-box; margin-bottom: 15px; text-align: center; }
        .login-card button { background: #0284c7; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
        .tab-btn { background: #64748b; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .tab-btn.active { background: #0284c7; }
        .refresh-btn { background: #0d9488; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .user-tag { margin-left: auto; font-size: 14px; color: #475569; background: #f1f5f9; padding: 8px 15px; border-radius: 6px; border: 1px solid #cbd5e1; display: flex; align-items: center; gap: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 16px 12px; text-align: left; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }
        th { background-color: #f8fafc; color: #475569; font-weight: 700; font-size: 14px; text-transform: uppercase; }
        .cliente-info { font-size: 16px; font-weight: 700; color: #0f172a; }
        .cliente-sub { font-size: 13px; color: #64748b; margin-top: 3px; }
        .detalles-resumen { font-size: 14px; color: #475569; display: flex; align-items: center; justify-content: space-between; background: #f8fafc; padding: 10px 14px; border-radius: 6px; border-left: 4px solid #0284c7; }
        .btn-accion-group { display: flex; flex-direction: column; gap: 6px; align-items: center; }
        button.action-btn { background: #16a34a; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 700; width: 110px; }
        button.called-btn { background: #ca8a04; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 700; width: 110px; }
        button.resolved-btn { background: #475569; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 700; width: 110px; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h2>Identificación de Agente</h2>
        <p>Ingrese su nombre y asigne la ventanilla fija para esta PC.</p>
        <input type="text" id="inputUsuario" placeholder="Ej: Lic. Carlos Pérez" autofocus>
        <select id="selectVentanillaLogin">
            <option value="1">Ventanilla 1</option><option value="2">Ventanilla 2</option>
            <option value="3" selected>Ventanilla 3</option><option value="4">Ventanilla 4</option>
        </select>
        <button onclick="guardarUsuario()">Ingresar al Panel</button>
    </div>
</div>

<div class="container">
    <div class="header">
        <img src="img/logo.png" alt="Logo">
        <h2>Panel de Atención - Oficinas</h2>
        <div class="ventanilla-box" id="lblVentanillaFija">Ventanilla Asignada: --</div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="btnPendientes" onclick="cambiarVista('pendientes')">Cola Activa (Hoy)</button>
        <button class="tab-btn" id="btnAyer" onclick="cambiarVista('ayer')">Registros Resueltos</button>
        <button class="refresh-btn" onclick="cargarDatos()">Actualizar Datos</button>
        <div class="user-tag">Agente: <b id="nombreAgenteSpan">---</b> <button onclick="cambiarUsuario()" style="background:none;border:none;color:#ef4444;cursor:pointer;font-weight:bold;">[Cambiar]</button></div>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 10%;">ID</th>
                <th style="width: 15%;">Fecha / Hora</th>
                <th style="width: 25%;">Cliente</th>
                <th style="width: 35%;">Detalles</th>
                <th style="width: 15%; text-align: center;" id="thAccion">Acción</th>
            </tr>
        </thead>
        <tbody id="tablaCola"></tbody>
    </table>
</div>

<script>
const URL_WEB_APP = "AQUI_PEGA_TU_URL_DE_WEB_APP";
let vistaActual = 'pendientes';
let datosCache = [];
let usuarioActual = localStorage.getItem("agente_nombre_fijo") || "";
let ventanillaFija = localStorage.getItem("agente_ventanilla_fija") || "3";
let peticionEnCurso = false;

window.onload = function() {
    if (usuarioActual) {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('nombreAgenteSpan').innerText = usuarioActual;
        document.getElementById('lblVentanillaFija').innerText = "Ventanilla Asignada: " + ventanillaFija;
        cargarDatos();
        setInterval(cargarDatos, 4000);
    } else {
        document.getElementById('loginOverlay').style.display = 'flex';
    }
};

function guardarUsuario() {
    let input = document.getElementById('inputUsuario').value.trim();
    if (!input) { alert("Por favor ingrese un nombre de agente válido."); return; }
    usuarioActual = input;
    ventanillaFija = document.getElementById('selectVentanillaLogin').value;
    localStorage.setItem("agente_nombre_fijo", usuarioActual);
    localStorage.setItem("agente_ventanilla_fija", ventanillaFija);
    document.getElementById('nombreAgenteSpan').innerText = usuarioActual;
    document.getElementById('lblVentanillaFija').innerText = "Ventanilla Asignada: " + ventanillaFija;
    document.getElementById('loginOverlay').style.display = 'none';
    cargarDatos();
    setInterval(cargarDatos, 4000);
}

function cambiarUsuario() {
    localStorage.removeItem("agente_nombre_fijo");
    localStorage.removeItem("agente_ventanilla_fija");
    document.getElementById('loginOverlay').style.display = 'flex';
}

async function cargarDatos() {
    if (!usuarioActual || peticionEnCurso) return;
    peticionEnCurso = true;
    try {
        let res = await fetch(URL_WEB_APP + "?t=" + new Date().getTime());
        datosCache = await res.json();
        renderizarTabla();
    } catch (e) {
    } finally {
        peticionEnCurso = false;
    }
}

function cambiarVista(vista) {
    vistaActual = vista;
    document.getElementById('btnPendientes').className = vista === 'pendientes' ? 'tab-btn active' : 'tab-btn';
    document.getElementById('btnAyer').className = vista === 'ayer' ? 'tab-btn active' : 'tab-btn';
    document.getElementById('thAccion').style.display = vista === 'pendientes' ? 'table-cell' : 'none';
    renderizarTabla();
}

function renderizarTabla() {
    let tbody = document.getElementById('tablaCola');
    tbody.innerHTML = "";

    let filtrados = datosCache.filter(row => {
        let esResueltoServidor = (String(row.Estado).trim().toLowerCase() === "resuelto");
        if (vistaActual === 'pendientes') {
            return !esResueltoServidor && (row.Estado === "Pendiente" || row.Estado === "Llamado");
        } else {
            return esResueltoServidor;
        }
    });

    if (filtrados.length === 0) {
        let mensaje = vistaActual === 'pendientes' ? "No hay clientes activos en la cola." : "No hay registros resueltos.";
        let colspan = vistaActual === 'pendientes' ? 5 : 4;
        tbody.innerHTML = `<tr><td colspan="${colspan}" style="text-align:center; color:#64748b; padding: 30px;">${mensaje}</td></tr>`;
        return;
    }

    filtrados.forEach(row => {
        let tr = document.createElement('tr');
        let columnaAccion = '';
        
        if (vistaActual === 'pendientes') {
            let botonLlamar = (row.Estado === "Llamado") ? 
                `<button class="called-btn" onclick="llamarCliente('${row.ID}')">🔄 Re-llamar</button>` : 
                `<button class="action-btn" onclick="llamarCliente('${row.ID}')">📢 Llamar</button>`;
            
            columnaAccion = `
                <td style="text-align: center;">
                    <div class="btn-accion-group">
                        ${botonLlamar}
                        <button class="resolved-btn" id="btnResuelto_${row.ID}" onclick="marcarResuelto('${row.ID}')">✔️ Resuelto</button>
                    </div>
                </td>`;
        }
        
        tr.innerHTML = `
            <td><b style="color: #0284c7; font-size: 15px;">${row.ID}</b></td>
            <td style="color: #475569; font-size: 13px;">${row.FechaHora ? new Date(row.FechaHora).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : ''}</td>
            <td><div class="cliente-info">${row.Nombres} ${row.Apellidos}</div><div class="cliente-sub">Género: ${row.Genero}</div></td>
            <td><div class="detalles-resumen"><span>Padre: ${row.Padre || 'N/D'} | Comentarios: ${row.Comentarios || 'Ninguno'}</span></div></td>
            ${columnaAccion}
        `;
        tbody.appendChild(tr);
    });
}

async function llamarCliente(id) {
    try {
        await fetch(`${URL_WEB_APP}?accion=llamar&id=${encodeURIComponent(id)}&ventanilla=${encodeURIComponent(ventanillaFija)}&t=${Date.now()}`);
        await cargarDatos();
    } catch(e) {
        alert("Error al llamar al cliente.");
    }
}

async function marcarResuelto(id) {
    let btn = document.getElementById(`btnResuelto_${id}`);
    if (btn) { btn.innerText = "Guardando..."; btn.disabled = true; }
    
    let atendidoTexto = usuarioActual + " (V." + ventanillaFija + ")";
    
    try {
        let res = await fetch(`${URL_WEB_APP}?accion=resuelto&id=${encodeURIComponent(id)}&usuario=${encodeURIComponent(atendidoTexto)}&t=${Date.now()}`);
        let data = await res.json();
        if (data.status === "ok") {
            await cargarDatos();
        } else {
            alert("No se pudo actualizar el registro en el servidor.");
            if (btn) { btn.innerText = "✔️ Resuelto"; btn.disabled = false; }
        }
    } catch (e) {
        alert("Error de conexión al marcar como resuelto.");
        if (btn) { btn.innerText = "✔️ Resuelto"; btn.disabled = false; }
    }
}
</script>
</body>
</html>
