<script>
const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbxnduaG9Pr9xn46XUE_a2qVAqWcHpdIIMrspt_iNUAXwdtJ21Cq6yjKhZm9vkFB5WHn/exec";
let vistaActual = 'pendientes';
let datosCache = [];
let localOverrides = {}; 
let usuarioActual = localStorage.getItem("agente_nombre_fijo") || "";
let ventanillaFija = localStorage.getItem("agente_ventanilla_fija") || "3";
let ultimoTimestampAviso = Date.now();
let temporizadorCierrePopup = null;
let ultimoMovimiento = Date.now();

window.onload = function() {
    if (usuarioActual) {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('nombreAgenteSpan').innerText = usuarioActual;
        document.getElementById('lblVentanillaFija').innerText = "Ventanilla Asignada: " + ventanillaFija;
        inicializarUltimoAviso();
        cargarDatos();
        setInterval(verificarMensajesSupervisor, 3000);
    } else {
        document.getElementById('loginOverlay').style.display = 'flex';
    }
};

window.addEventListener('mousemove', despertarSistema);
window.addEventListener('click', despertarSistema);
window.addEventListener('keypress', despertarSistema);
window.addEventListener('touchstart', despertarSistema);

function despertarSistema() {
    let ahora = Date.now();
    if (ahora - ultimoMovimiento > 25000) {
        cargarDatos();
    }
    ultimoMovimiento = ahora;
}

document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
        cargarDatos();
    }
});

async function inicializarUltimoAviso() {
    try {
        let res = await fetch(URL_WEB_APP + "?accion=obtener_avisos&t=" + new Date().getTime());
        let avisos = await res.json();
        let miAviso = avisos.find(a => a.ventanilla === ventanillaFija);
        if (miAviso && miAviso.timestamp) {
            ultimoTimestampAviso = miAviso.timestamp;
        }
    } catch(e) {}
}

function guardarUsuario() {
    let input = document.getElementById('inputUsuario').value.trim();
    if (!input) { alert("Por favor ingrese un nombre de agente válido."); return; }
    usuarioActual = input;
    ventanillaFija = document.getElementById('selectVentanillaLogin').value;
    
    localStorage.setItem("agente_nombre_fijo", usuarioActual);
    localStorage.setItem("agente_ventanilla_fija", ventanillaFija);
    
    document.getElementById('nombreAgenteSpan').innerText = usuarioActual;
    document.getElementById('lblVentanillaFija').innerText = "Ventanilla Asignada: " + ventanillaFija;
    document.getElementById('loginOverlay').style.display = 'none';
    
    inicializarUltimoAviso();
    cargarDatos();
    setInterval(verificarMensajesSupervisor, 3000);
}

function cambiarUsuario() {
    localStorage.removeItem("agente_nombre_fijo");
    localStorage.removeItem("agente_ventanilla_fija");
    document.getElementById('inputUsuario').value = "";
    document.getElementById('loginOverlay').style.display = 'flex';
}

async function verificarMensajesSupervisor() {
    if (!ventanillaFija) return;
    try {
        let res = await fetch(URL_WEB_APP + "?accion=obtener_avisos&t=" + new Date().getTime());
        let avisos = await res.json();
        let miAviso = avisos.find(a => a.ventanilla === ventanillaFija);
        
        if (miAviso && miAviso.timestamp > ultimoTimestampAviso) {
            ultimoTimestampAviso = miAviso.timestamp;
            mostrarPopupAviso(miAviso.mensaje);
        }
    } catch(e) {}
}

function mostrarPopupAviso(texto) {
    let popup = document.getElementById('popupAlerta');
    let textoDiv = document.getElementById('textoPopupMensaje');
    let timerBar = document.getElementById('popupTimerBar');
    
    textoDiv.innerText = texto;
    popup.style.display = 'block';

    timerBar.style.transition = 'none';
    timerBar.style.width = '100%';
    setTimeout(() => {
        timerBar.style.transition = 'width 15s linear';
        timerBar.style.width = '0%';
    }, 50);

    if (navigator.vibrate) navigator.vibrate(200);
    if (temporizadorCierrePopup) clearTimeout(temporizadorCierrePopup);

    temporizadorCierrePopup = setTimeout(() => {
        cerrarPopup();
    }, 15000);
}

function cerrarPopup() {
    let popup = document.getElementById('popupAlerta');
    popup.style.display = 'none';
    if (temporizadorCierrePopup) clearTimeout(temporizadorCierrePopup);
}

async function cargarDatos() {
    if (!usuarioActual) return;
    try {
        let res = await fetch(URL_WEB_APP + "?t=" + new Date().getTime());
        let serverData = await res.json();
        
        datosCache = serverData.map(row => {
            if (localOverrides[row.ID]) {
                if (Date.now() - localOverrides[row.ID].timestamp < 15000) {
                    return { ...row, ...localOverrides[row.ID] };
                } else {
                    delete localOverrides[row.ID];
                }
            }
            return row;
        });

        renderizarTabla();
    } catch (e) { console.error("Error al obtener datos:", e); }
}

function cambiarVista(vista) {
    vistaActual = vista;
    document.getElementById('btnPendientes').className = vista === 'pendientes' ? 'tab-btn active' : 'tab-btn';
    document.getElementById('btnAyer').className = vista === 'ayer' ? 'tab-btn active' : 'tab-btn';
    document.getElementById('thAccion').style.display = vista === 'pendientes' ? 'table-cell' : 'none';
    renderizarTabla();
}

function formatearFecha(fechaStr) {
    if (!fechaStr) return '';
    try {
        let d = new Date(fechaStr);
        if (!isNaN(d.getTime())) {
            return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }
    } catch(err) {}
    return fechaStr;
}

function renderizarTabla() {
    let tbody = document.getElementById('tablaCola');
    tbody.innerHTML = "";
    let hoyStr = new Date().toLocaleDateString();

    let filtrados = [];
    if (vistaActual === 'pendientes') {
        // Filtro estricto: Solo muestra lo que realmente esté Pendiente o Llamado
        filtrados = datosCache.filter(row => row.Estado === "Pendiente" || row.Estado === "Llamado");
    } else {
        filtrados = datosCache.filter(row => {
            if (!row.FechaHora) return false;
            let d = new Date(row.FechaHora);
            let fechaFila = !isNaN(d.getTime()) ? d.toLocaleDateString() : row.FechaHora;
            return fechaFila !== hoyStr || row.Estado === "Resuelto";
        });
    }

    if (filtrados.length === 0) {
        let mensaje = vistaActual === 'pendientes' ? "No hay clientes activos en la cola." : "No hay registros anteriores.";
        let colspan = vistaActual === 'pendientes' ? 5 : 4;
        tbody.innerHTML = `<tr><td colspan="${colspan}" style="text-align:center; color:#64748b; padding: 30px; font-size: 15px;">${mensaje}</td></tr>`;
        return;
    }

    filtrados.forEach(row => {
        let tr = document.createElement('tr');
        let columnaAccion = '';
        
        if (vistaActual === 'pendientes') {
            let botonLlamar = (row.Estado === "Llamado") ? 
                `<button class="called-btn" onclick="llamarCliente('${row.ID}')">🔄 Re-llamar</button>` : 
                `<button class="action-btn" onclick="llamarCliente('${row.ID}')">📢 Llamar</button>`;
            
            columnaAccion = `
                <td style="text-align: center;">
                    <div class="btn-accion-group">
                        ${botonLlamar}
                        <button class="resolved-btn" id="btnResuelto_${row.ID}" onclick="marcarResuelto('${row.ID}')">✔️ Resuelto</button>
                    </div>
                </td>`;
        }
        
        let fechaLimpia = formatearFecha(row.FechaHora);
        
        tr.innerHTML = `
            <td><b style="color: #0284c7; font-size: 15px;">${row.ID}</b></td>
            <td style="color: #475569; font-size: 13px;">${fechaLimpia}</td>
            <td>
                <div class="cliente-info">${row.Nombres} ${row.Apellidos}</div>
                <div class="cliente-sub">Género: ${row.Genero} | Nacimiento: ${row.FechaNacimiento ? row.FechaNacimiento.substring(0,10) : 'N/D'}</div>
            </td>
            <td>
                <div class="detalles-resumen">
                    <span>Padre: ${row.Padre || 'N/D'} | Comentarios: ${row.Comentarios ? (row.Comentarios.substring(0, 20) + '...') : 'Ninguno'}</span>
                    <button class="view-btn" onclick='abrirModal(${JSON.stringify(row)})'>👁️ Ver</button>
                </div>
            </td>
            ${columnaAccion}
        `;
        tbody.appendChild(tr);
    });
}

function abrirModal(row) {
    document.getElementById('mId').innerText = row.ID;
    document.getElementById('mNombre').innerText = row.Nombres + " " + row.Apellidos;
    document.getElementById('mGenero').innerText = row.Genero || 'N/D';
    document.getElementById('mNacimiento').innerText = row.FechaNacimiento || 'N/D';
    document.getElementById('mPadre').innerText = row.Padre || 'No registrado';
    document.getElementById('mMadre').innerText = row.Madre || 'No registrado';
    document.getElementById('mLugar').innerText = row.LugarNacimiento || 'No registrado';
    document.getElementById('mComentarios').innerText = row.Comentarios || 'Ninguno';
    document.getElementById('mEstado').innerText = row.Estado;
    document.getElementById('mAtendido').innerText = (row.AtendidoPor || 'Pendiente') + " (Ventanilla " + (row.Ventanilla || "3") + ")";
    document.getElementById('modalDetalles').style.display = 'flex';
}

function cerrarModal() { document.getElementById('modalDetalles').style.display = 'none'; }
function cerrarModalAfuera(event) { if (event.target.id === 'modalDetalles') cerrarModal(); }

function llamarCliente(id) {
    let override = {
        Estado: "Llamado",
        Ventanilla: ventanillaFija,
        UltimoLlamado: Date.now(),
        timestamp: Date.now()
    };
    localOverrides[id] = override;

    let index = datosCache.findIndex(r => r.ID === id);
    if (index !== -1) {
        datosCache[index] = { ...datosCache[index], ...override };
        renderizarTabla();
    }

    let urlLlamada = `${URL_WEB_APP}?accion=llamar&id=${encodeURIComponent(id)}&ventanilla=${encodeURIComponent(ventanillaFija)}&t=${new Date().getTime()}`;
    fetch(urlLlamada, { method: 'GET', mode: 'no-cors' });
}

function marcarResuelto(id) {
    let btn = document.getElementById(`btnResuelto_${id}`);
    if (btn) { btn.innerText = "Guardando..."; btn.disabled = true; }
    
    let atendidoTexto = usuarioActual + " (V." + ventanillaFija + ")";
    
    // CORRECCIÓN: Forzamos el estado a Resuelto y un timestamp extendido de protección (30s) 
    // para que la interfaz local lo oculte de inmediato de la cola activa sin congelarse.
    let override = {
        Estado: "Resuelto",
        AtendidoPor: atendidoTexto,
        timestamp: Date.now() + 15000 // Protección extendida local
    };
    localOverrides[id] = override;

    let index = datosCache.findIndex(r => r.ID === id);
    if (index !== -1) {
        datosCache[index] = { ...datosCache[index], ...override };
        renderizarTabla(); // Desaparece al instante de la tabla activa
    }

    try {
        let urlResuelto = `${URL_WEB_APP}?accion=resuelto&id=${encodeURIComponent(id)}&usuario=${encodeURIComponent(atendidoTexto)}&t=${new Date().getTime()}`;
        fetch(urlResuelto, { method: 'GET', mode: 'no-cors' });
    } catch (e) {
        alert("Error al marcar como resuelto.");
        if (btn) { btn.innerText = "✔️ Resuelto"; btn.disabled = false; }
    }
}

setInterval(cargarDatos, 2000);
</script>
