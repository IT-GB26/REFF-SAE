<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Oficinas - Control de Turnos</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
        .header img { max-height: 55px; }
        .ventanilla-box { background: #e0f2fe; color: #0369a1; padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 16px; }
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.9); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .login-card { background: white; padding: 40px; border-radius: 16px; width: 380px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .login-card h2 { color: #0f172a; margin-top: 0; margin-bottom: 10px; font-size: 22px; }
        .login-card p { color: #64748b; font-size: 14px; margin-bottom: 20px; }
        .login-card input, .login-card select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; box-sizing: border-box; margin-bottom: 15px; text-align: center; }
        .login-card button { background: #0284c7; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
        .tab-btn { background: #64748b; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .tab-btn.active { background: #0284c7; }
        .refresh-btn { background: #0d9488; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .user-tag { margin-left: auto; font-size: 14px; color: #475569; background: #f1f5f9; padding: 8px 15px; border-radius: 6px; border: 1px solid #cbd5e1; display: flex; align-items: center; gap: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 16px 12px; text-align: left; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }
        th { background-color: #f8fafc; color: #475569; font-weight: 700; font-size: 14px; text-transform: uppercase; }
        .cliente-info { font-size: 16px; font-weight: 700; color: #0f172a; }
        .cliente-sub { font-size: 13px; color: #64748b; margin-top: 3px; }
        .detalles-resumen { font-size: 14px; color: #475569; display: flex; align-items: center; justify-content: space-between; background: #f8fafc; padding: 10px 14px; border-radius: 6px; border-left: 4px solid #0284c7; }
        .btn-accion-group { display: flex; flex-direction: column; gap: 6px; align-items: center; }
        button.action-btn { background: #16a34a; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 700; width: 110px; }
        button.called-btn { background: #ca8a04; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 700; width: 110px; }
        button.resolved-btn { background: #475569; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 700; width: 110px; }
        button.view-btn { background: #0284c7; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; }
        
        #modalDetalles { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.7); z-index: 9998; display: none; justify-content: center; align-items: center; }
        .modal-card { background: white; padding: 30px; border-radius: 16px; width: 500px; max-width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.3); max-height: 90vh; overflow-y: auto; }
        .modal-card h3 { color: #0284c7; margin-top: 0; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .modal-body p { margin: 8px 0; font-size: 14px; color: #334155; }
        .modal-body b { color: #0f172a; }
        .modal-close { background: #64748b; color: white; border: none; width: 100%; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 14px; }
    
/* Aviso interno enviado por Jefatura */
#avisoJefaturaOficina{
 position:fixed; top:18px; left:50%; transform:translateX(-50%);
 width:min(760px,90vw); z-index:10000; display:none;
 background:#0f172a; color:white; border:2px solid #0284c7;
 border-radius:14px; padding:16px 20px; box-shadow:0 12px 35px rgba(0,0,0,.28);
}
#avisoJefaturaOficina .aj-titulo{font-size:12px;font-weight:800;color:#7dd3fc;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
#avisoJefaturaOficina .aj-texto{font-size:20px;font-weight:700;line-height:1.25}
#avisoJefaturaOficina .aj-cerrar{position:absolute;right:10px;top:8px;border:0;background:transparent;color:white;font-size:20px;cursor:pointer}

</style>
</head>
<body>

<div id="avisoJefaturaOficina">
 <button class="aj-cerrar" onclick="cerrarAvisoJefatura()">×</button>
 <div class="aj-titulo">Aviso de Jefatura</div>
 <div class="aj-texto" id="textoAvisoJefaturaOficina"></div>
</div>


<div id="loginOverlay">
    <div class="login-card">
        <h2>Identificación de Agente</h2>
        <p>Ingrese su nombre para iniciar la atención. Seleccione la ventanilla pública.</p>
        <input type="text" id="inputUsuario" placeholder="Ej: Lic. Carlos Pérez" autofocus>
        <select id="selectVentanillaLogin"><option value="1" selected>Ventanilla 1</option><option value="2">Ventanilla 2</option></select>
        <button onclick="guardarUsuario()">Ingresar al Panel</button>
    </div>
</div>

<div id="modalDetalles">
    <div class="modal-card">
        <h3>Detalles del Turno</h3>
        <div class="modal-body" id="contenidoModal"></div>
        <button class="modal-close" onclick="cerrarModal()">Cerrar</button>
    </div>
</div>

<div class="container">
    <div class="header">
        <img src="img/logo.png" alt="Logo">
        <h2>Panel de Atención - Oficinas</h2>
        <div class="ventanilla-box" id="lblVentanillaFija">Ventanilla Asignada: --</div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="btnPendientes" onclick="cambiarVista('pendientes')">Cola Activa (Hoy)</button>
        <button class="tab-btn" id="btnAyer" onclick="cambiarVista('ayer')">Registros Resueltos</button>
        
        <select id="filtroFechaResueltos" onchange="renderizarTabla()" style="display:none;padding:9px 12px;border:1px solid #cbd5e1;border-radius:6px;background:white;"><option value="hoy">Hoy</option><option value="ayer">Ayer</option><option value="7dias">Últimos 7 días</option><option value="todos">Todos</option></select>
<div class="user-tag">Agente: <b id="nombreAgenteSpan">---</b> <button onclick="cambiarUsuario()" style="background:none;border:none;color:#ef4444;cursor:pointer;font-weight:bold;">[Cambiar]</button></div>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 10%;">ID</th>
                <th style="width: 15%;">Fecha / Hora</th>
                <th style="width: 25%;">Cliente</th>
                <th style="width: 35%;">Detalles</th>
                <th style="width: 15%; text-align: center;" id="thAccion">Acción</th>
            </tr>
        </thead>
        <tbody id="tablaCola"></tbody>
    </table>
</div>

<script>
const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbyYH6-csf9yKkz-x9MvNRPTkQWdFBR_aZQG5OXCctAaVEmiEXAPP2D60F3a_FCHrrB0/exec";
const CACHE_KEY = 'sede2_oficina_compartida_cache_v1';
let vistaActual='pendientes', datosCache=[], usuarioActual='', ventanillaFija='1';
let peticionEnCurso=false, accionEnCurso=false, timerCarga=null;
setInterval(()=>{if(peticionEnCurso)peticionEnCurso=false},12000);

function leerCache(){try{const x=JSON.parse(localStorage.getItem(CACHE_KEY)||'[]');datosCache=Array.isArray(x)?x:[]}catch(e){datosCache=[]}}
function guardarCache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify(datosCache))}catch(e){}}

window.onload=function(){leerCache();renderizarTabla();document.getElementById('loginOverlay').style.display='flex';document.getElementById('inputUsuario').focus();};

function guardarUsuario(){
 const input=document.getElementById('inputUsuario').value.trim();
 if(!input){alert('Por favor ingrese un nombre de agente válido.');return}
 usuarioActual=input; ventanillaFija=document.getElementById('selectVentanillaLogin').value;
 document.getElementById('nombreAgenteSpan').innerText=usuarioActual;
 document.getElementById('lblVentanillaFija').innerText='Ventanilla Asignada: '+ventanillaFija;
 document.getElementById('loginOverlay').style.display='none';
 cargarDatos();
 if(timerCarga)clearInterval(timerCarga); timerCarga=setInterval(cargarDatos,5000);
}
function cambiarUsuario(){usuarioActual='';if(timerCarga){clearInterval(timerCarga);timerCarga=null}document.getElementById('loginOverlay').style.display='flex';document.getElementById('inputUsuario').value='';document.getElementById('inputUsuario').focus()}

async function cargarDatos(){
 if(!usuarioActual||peticionEnCurso||accionEnCurso||!navigator.onLine)return;
 peticionEnCurso=true;

 // V6.7.2: ninguna consulta puede dejar bloqueado el polling.
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),7000);

 try{
  const r=await fetch(URL_WEB_APP+'?accion=oficina&t='+Date.now(),{
    cache:'no-store',
    signal:controller.signal
  });
  if(!r.ok)throw new Error('HTTP '+r.status);

  const j=await r.json();
  if(j&&j.aviso)mostrarAvisoJefatura(j.aviso);

  datosCache=Array.isArray(j)?j:(j.datos||[]);
  const pendientesSync=new Set(leerColaResueltos().map(x=>String(x.uid)));
  if(pendientesSync.size){
    datosCache=datosCache.filter(x=>!pendientesSync.has(String(x.UID)));
  }

  guardarCache();
  renderizarTabla();
 }catch(e){
  // Conserva la última lista válida. El siguiente ciclo vuelve a consultar.
 }finally{
  clearTimeout(timeout);
  peticionEnCurso=false;
 }
}

function cambiarVista(vista){
 vistaActual=vista;
 document.getElementById('btnPendientes').className=vista==='pendientes'?'tab-btn active':'tab-btn';
 document.getElementById('btnAyer').className=vista==='ayer'?'tab-btn active':'tab-btn';
 document.getElementById('thAccion').style.display=vista==='pendientes'?'table-cell':'none';
 const ff=document.getElementById('filtroFechaResueltos');if(ff)ff.style.display=vista==='ayer'?'inline-block':'none';
 renderizarTabla();
}
function turnoCompartido(){
 const llamado=datosCache.find(x=>x.Estado==='Llamado');
 if(llamado)return llamado;
 return datosCache.find(x=>x.Estado==='Pendiente')||null;
}
function renderizarTabla(){
 const tbody=document.getElementById('tablaCola');tbody.innerHTML='';
 let filtrados=[];
 if(vistaActual==='pendientes'){
  filtrados=datosCache.filter(x=>{
   if(x.Estado==='Resuelto')return false;
   const f=new Date(x.FechaHora);
   if(isNaN(f))return false;
   const ahora=new Date();
   return f.getFullYear()===ahora.getFullYear()
       && f.getMonth()===ahora.getMonth()
       && f.getDate()===ahora.getDate();
  });
  filtrados.sort((a,b)=>{
    const na=parseInt(String(a.ID||'').replace(/\D/g,''))||0;
    const nb=parseInt(String(b.ID||'').replace(/\D/g,''))||0;
    return na-nb;
  });
 }
 else{
  filtrados=datosCache.filter(x=>String(x.Estado).toLowerCase()==='resuelto');
  const tipo=(document.getElementById('filtroFechaResueltos')||{}).value||'hoy', ahora=new Date(), inicio=new Date(ahora.getFullYear(),ahora.getMonth(),ahora.getDate());
  filtrados=filtrados.filter(r=>{const f=new Date(r.FechaHora);if(isNaN(f))return false;if(tipo==='todos')return true;if(tipo==='hoy')return f>=inicio;if(tipo==='ayer'){const a=new Date(inicio);a.setDate(a.getDate()-1);return f>=a&&f<inicio}if(tipo==='7dias'){const d=new Date(inicio);d.setDate(d.getDate()-6);return f>=d}return true});
  filtrados.sort((a,b)=>new Date(b.FechaHora||0)-new Date(a.FechaHora||0));
 }
 if(!filtrados.length){tbody.innerHTML=`<tr><td colspan="5" style="text-align:center;color:#64748b;padding:30px;">${vistaActual==='pendientes'?'No hay clientes activos en la cola.':'No hay registros resueltos.'}</td></tr>`;return}
 filtrados.forEach(row=>{
  const tr=document.createElement('tr'), ver=`<button class="view-btn" onclick="verDetalles('${row.UID}')">👁️ Ver</button>`;
  let accion=`<td style="text-align:center;">${ver}</td>`;
  if(vistaActual==='pendientes'){
   const llamado=row.Estado==='Llamado';
   const llamar=llamado?`<button class="called-btn" onclick="accionTurno('rellamar','${row.UID}',this)">🔄 Re-llamar</button>`:`<button class="action-btn" onclick="accionTurno('llamar','${row.UID}',this)">📢 Llamar</button>`;
   const resolver=`<button class="resolved-btn" onclick="accionTurno('resuelto','${row.UID}',this)">✔️ Resuelto</button>`;
   accion=`<td style="text-align:center;"><div class="btn-accion-group">${ver}${llamar}${resolver}</div></td>`;
  }
  tr.innerHTML=`<td><b style="color:#0284c7;font-size:15px;">${row.ID||''}</b></td><td style="color:#475569;font-size:13px;">${row.FechaHora?new Date(row.FechaHora).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):''}</td><td><div class="cliente-info">${row.Nombres||''} ${row.Apellidos||''}</div><div class="cliente-sub">Género: ${row.Genero||''}</div></td><td><div class="detalles-resumen"><span>Padre: ${row.Padre||'N/D'} | Comentarios: ${row.Comentarios||'Ninguno'}</span></div></td>${accion}`;
  tbody.appendChild(tr);
 });
}
function verDetalles(uid){
 const row=datosCache.find(x=>String(x.UID)===String(uid));if(!row)return;
 const fn=row.FechaNacimiento?String(row.FechaNacimiento).split('T')[0]:'';
 document.getElementById('contenidoModal').innerHTML=`<p><b>ID de Turno:</b> ${row.ID||''}</p><p><b>Fecha y Hora:</b> ${row.FechaHora?new Date(row.FechaHora).toLocaleString():''}</p><p><b>Nombres:</b> ${row.Nombres||''}</p><p><b>Apellidos:</b> ${row.Apellidos||''}</p><p><b>Género:</b> ${row.Genero||''}</p><p><b>Fecha de Nacimiento:</b> ${fn}</p><p><b>Padre:</b> ${row.Padre||'N/D'}</p><p><b>Madre:</b> ${row.Madre||'N/D'}</p><p><b>Lugar de Nacimiento:</b> ${row.LugarNacimiento||''}</p><p><b>Comentarios:</b> ${row.Comentarios||'Ninguno'}</p>`;
 document.getElementById('modalDetalles').style.display='flex';
}
function cerrarModal(){document.getElementById('modalDetalles').style.display='none'}


const CLAVE_COLA_RESUELTOS_BASE='sede2_cola_resueltos_v67';
function claveColaResueltos(){
 const agente=(usuarioActual||'sin_agente').trim().toLowerCase().replace(/[^a-z0-9áéíóúüñ_-]+/gi,'_');
 return CLAVE_COLA_RESUELTOS_BASE+'_v'+String(ventanillaFija||'1')+'_'+agente;
}
let procesandoColaResueltos=false;

function leerColaResueltos(){
 try{
   const x=JSON.parse(localStorage.getItem(claveColaResueltos())||'[]');
   return Array.isArray(x)?x:[];
 }catch(e){return []}
}
function guardarColaResueltos(c){
 localStorage.setItem(claveColaResueltos(),JSON.stringify(c));
}
function encolarResuelto(uid,usuario){
 const c=leerColaResueltos();
 if(!c.some(x=>String(x.uid)===String(uid))){
   c.push({uid:String(uid),usuario:String(usuario),ventanilla:String(ventanillaFija),creado:Date.now(),intentos:0});
   guardarColaResueltos(c);
 }
}
function actualizarIndicadorPendientes(){
 const n=leerColaResueltos().length;
 let el=document.getElementById('syncPendientesV67');
 if(!el){
   el=document.createElement('div');
   el.id='syncPendientesV67';
   el.style.cssText='position:fixed;right:18px;bottom:18px;z-index:9998;background:#fff3cd;color:#664d03;border:1px solid #ffecb5;border-radius:10px;padding:8px 12px;font:600 13px Arial;box-shadow:0 3px 12px rgba(0,0,0,.15);display:none';
   document.body.appendChild(el);
 }
 if(n){el.textContent=n+' resolución'+(n===1?'':'es')+' pendiente'+(n===1?'':'s')+' de sincronizar';el.style.display='block'}
 else el.style.display='none';
}
function navegarResueltoEnSegundoPlano(item){
 return new Promise((resolve,reject)=>{
   const frame=document.createElement('iframe');
   frame.style.display='none';
   let fin=false;
   const limpiar=()=>{if(frame.parentNode)frame.parentNode.removeChild(frame)};
   const timer=setTimeout(()=>{if(fin)return;fin=true;limpiar();reject(new Error('timeout'))},12000);
   frame.onload=()=>{if(fin)return;fin=true;clearTimeout(timer);setTimeout(limpiar,200);resolve()};
   document.body.appendChild(frame);
   frame.src=URL_WEB_APP+'?accion=resuelto&uid='+encodeURIComponent(item.uid)
      +'&usuario='+encodeURIComponent(item.usuario)+'&ventanilla='+encodeURIComponent(item.ventanilla||ventanillaFija)+'&t='+Date.now();
 });
}
async function confirmarResueltoServidor(uid){
 try{
   const r=await fetch(URL_WEB_APP+'?accion=oficina&t='+Date.now(),{cache:'no-store'});
   const j=await r.json();
   const lista=Array.isArray(j)?j:(j.datos||[]);
   const t=lista.find(x=>String(x.UID)===String(uid));
   return !t || String(t.Estado).toLowerCase()==='resuelto';
 }catch(e){return false}
}
async function procesarColaResueltos(){
 if(procesandoColaResueltos||!navigator.onLine)return;
 procesandoColaResueltos=true;
 try{
   let c=leerColaResueltos();
   if(!c.length){actualizarIndicadorPendientes();return}
   const item=c[0];
   try{
     await navegarResueltoEnSegundoPlano(item);
     await new Promise(r=>setTimeout(r,700));
     if(await confirmarResueltoServidor(item.uid)){
       c=leerColaResueltos().filter(x=>String(x.uid)!==String(item.uid));
       guardarColaResueltos(c);
       setTimeout(cargarDatos,150);
     }else{
       c=leerColaResueltos();
       const x=c.find(x=>String(x.uid)===String(item.uid));
       if(x)x.intentos=(x.intentos||0)+1;
       guardarColaResueltos(c);
     }
   }catch(e){
     c=leerColaResueltos();
     const x=c.find(x=>String(x.uid)===String(item.uid));
     if(x)x.intentos=(x.intentos||0)+1;
     guardarColaResueltos(c);
   }
 }finally{
   procesandoColaResueltos=false;
   actualizarIndicadorPendientes();
 }
}
setInterval(procesarColaResueltos,10000);
window.addEventListener('online',procesarColaResueltos);
setTimeout(()=>{actualizarIndicadorPendientes();procesarColaResueltos()},1200);

function navegarAccionOficina(tipo,uid){
 return new Promise((resolve,reject)=>{
   const frame=document.createElement('iframe');
   frame.style.display='none';
   let fin=false;
   const limpiar=()=>{if(frame.parentNode)frame.parentNode.removeChild(frame)};
   const timer=setTimeout(()=>{
     if(fin)return;
     fin=true; limpiar(); reject(new Error('timeout'));
   },12000);

   // Importante: asignar src ANTES de insertar el iframe evita la carrera about:blank.
   frame.src=URL_WEB_APP+'?accion='+encodeURIComponent(tipo)
      +'&uid='+encodeURIComponent(uid)+'&ventanilla='+encodeURIComponent(ventanillaFija)+'&t='+Date.now();

   frame.onload=()=>{
     if(fin)return;
     fin=true;
     clearTimeout(timer);
     setTimeout(limpiar,200);
     resolve();
   };
   frame.onerror=()=>{
     if(fin)return;
     fin=true;
     clearTimeout(timer);
     limpiar();
     reject(new Error('No se pudo enviar la acción'));
   };
   document.body.appendChild(frame);
 });
}

async function accionTurno(tipo,uid,btn){
 if(accionEnCurso)return;
 accionEnCurso=true;

 const boton=btn||(window.event&&window.event.currentTarget);
 const textoOriginal=boton?boton.innerHTML:'';

 try{
  if(tipo==='resuelto'){
    // V6.7.1: salida inmediata + cola persistente, ya validada.
    encolarResuelto(uid,usuarioActual);
    const i=datosCache.findIndex(x=>String(x.UID)===String(uid));
    if(i>=0){
      datosCache[i].Estado='Resuelto';
      datosCache[i].Ventanilla=ventanillaFija;
      datosCache[i].AtendidoPor=usuarioActual;
    }
    guardarCache();
    renderizarTabla();
    procesarColaResueltos();
    return;
  }

  if(tipo==='llamar'){
    // V6.7.3: no dependemos de fetch/JSON de Google para ejecutar la acción.
    // Reflejo local inmediato; el servidor y el polling siguen siendo la autoridad final.
    const i=datosCache.findIndex(x=>String(x.UID)===String(uid));
    if(i>=0){
      datosCache[i].Estado='Llamado';
      datosCache[i].Ventanilla=ventanillaFija;
      datosCache[i].UltimoLlamado=Date.now();
    }
    guardarCache();
    renderizarTabla();

    navegarAccionOficina('llamar',uid).catch(()=>{});
    setTimeout(cargarDatos,2500);
    return;
  }

  if(tipo==='rellamar'){
    // El turno ya está Llamado. Solo damos respuesta visual inmediata y
    // enviamos la re-llamada por navegación, sin parsear HTML como JSON.
    if(boton){
      boton.disabled=true;
      boton.innerHTML='✓ Re-llamado';
    }
    const urlRellamar=URL_WEB_APP+'?accion=rellamar&uid='+encodeURIComponent(uid)+'&ventanilla='+encodeURIComponent(ventanillaFija)+'&t='+Date.now();

    // V6.7.6: dispara exactamente la misma URL GET validada, pero como recurso
    // invisible. No abre ventanas y no intenta interpretar la respuesta JSON.
    const disparoRellamar=new Image();
    disparoRellamar.style.display='none';
    disparoRellamar.onload=disparoRellamar.onerror=()=>{disparoRellamar.remove()};
    document.body.appendChild(disparoRellamar);
    disparoRellamar.src=urlRellamar;

    // Limpieza de seguridad si el navegador no dispara load/error.
    setTimeout(()=>{try{disparoRellamar.remove()}catch(e){}},10000);
    setTimeout(()=>{
      if(boton&&document.body.contains(boton)){
        boton.innerHTML=textoOriginal;
        boton.disabled=false;
      }
    },900);
    setTimeout(cargarDatos,2500);
    return;
  }
 }finally{
   accionEnCurso=false;
 }
}
window.addEventListener('online',cargarDatos);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)cargarDatos()});

let ultimoAvisoJefaturaOficina = localStorage.getItem('sede2_ultimo_aviso_jefatura_oficina') || '';
let consultaAvisoJefaturaEnCurso=false;
let timerAvisoJefaturaOficina=null;

function cerrarAvisoJefatura(){
 const c=document.getElementById('avisoJefaturaOficina');
 if(c)c.style.display='none';
 clearTimeout(timerAvisoJefaturaOficina);
}
function mostrarAvisoJefatura(a){
 if(!a||!a.ID||!a.Mensaje)return;
 if(String(a.ID)===String(ultimoAvisoJefaturaOficina))return;
 ultimoAvisoJefaturaOficina=String(a.ID);
 localStorage.setItem('sede2_ultimo_aviso_jefatura_oficina',ultimoAvisoJefaturaOficina);
 const c=document.getElementById('avisoJefaturaOficina');
 const t=document.getElementById('textoAvisoJefaturaOficina');
 if(!c||!t)return;
 t.textContent=String(a.Mensaje);
 c.style.display='block';
 clearTimeout(timerAvisoJefaturaOficina);
 timerAvisoJefaturaOficina=setTimeout(cerrarAvisoJefatura,20000);
}
async function consultarAvisoJefatura(){
 if(consultaAvisoJefaturaEnCurso)return;
 consultaAvisoJefaturaEnCurso=true;
 try{
  const r=await fetch(URL_WEB_APP+'?accion=aviso_oficina&t='+Date.now(),{cache:'no-store'});
  const x=await r.json();
  if(x&&x.status==='ok'&&x.aviso)mostrarAvisoJefatura(x.aviso);
 }catch(e){}finally{consultaAvisoJefaturaEnCurso=false}
}


/* ============================================================
   PRUEBA SYNC RESUELTO ENTRE OFICINAS
   - No cambia Llamar / Re-llamar / Ventanilla 1-2.
   - Consulta independiente cada 3 s.
   - Solo aplica cambios de Estado=Resuelto recibidos del servidor.
   ============================================================ */
let syncResueltoEnCurso=false;

async function sincronizarResueltosEntreOficinas(){
  if(!usuarioActual || syncResueltoEnCurso || peticionEnCurso || accionEnCurso || procesandoColaResueltos || !navigator.onLine) return;
  syncResueltoEnCurso=true;

  const ctrl=new AbortController();
  const tm=setTimeout(()=>ctrl.abort(),2500);

  try{
    const r=await fetch(URL_WEB_APP+'?accion=oficina&sync_resuelto=1&t='+Date.now(),{
      cache:'no-store',
      signal:ctrl.signal
    });
    if(!r.ok) throw new Error('HTTP '+r.status);

    const j=await r.json();
    const lista=Array.isArray(j)?j:(Array.isArray(j.datos)?j.datos:[]);
    if(!lista.length) return;

    const estadoServidor=new Map(
      lista.map(x=>[String(x.UID), String(x.Estado||'').toLowerCase()])
    );

    let cambio=false;
    datosCache.forEach(x=>{
      if(estadoServidor.get(String(x.UID))==='resuelto' &&
         String(x.Estado||'').toLowerCase()!=='resuelto'){
        x.Estado='Resuelto';
        cambio=true;
      }
    });

    if(cambio){
      guardarCache();
      renderizarTabla();
    }
  }catch(e){
    // No toca la lista si esta consulta puntual falla.
  }finally{
    clearTimeout(tm);
    syncResueltoEnCurso=false;
  }
}

setInterval(sincronizarResueltosEntreOficinas,2000);
window.addEventListener('online',sincronizarResueltosEntreOficinas);

</script>
